<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1b4b">
  <meta name="robots" content="noindex">
  <title>SmartRoute Admin</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading" class="center-screen">טוען…</div>

  <section id="login" class="center-screen" hidden>
    <div class="login-card">
      <div class="brand big">Smart<span>Route</span> <em>Admin</em></div>
      <p class="muted">ניהול משתמשים ומעקב אחר ימי העבודה ב-SmartRoute</p>
      <button id="loginBtn" class="btn primary big" type="button">כניסה עם Google</button>
      <p id="loginErr" class="error"></p>
    </div>
  </section>

  <section id="denied" class="center-screen" hidden>
    <div class="login-card">
      <div class="brand big">Smart<span>Route</span> <em>Admin</em></div>
      <p><b>⛔ המשתמש לא קיים</b></p>
      <p class="muted" id="deniedEmail" dir="ltr"></p>
      <button id="switchBtn" class="btn primary" type="button">כניסה עם חשבון אחר</button>
    </div>
  </section>

  <div id="shell" hidden>
    <header class="topbar">
      <div class="brand">Smart<span>Route</span> <em>Admin</em></div>
      <nav class="tabs">
        <a href="#/overview" data-tab="overview">📊 סקירה</a>
        <a href="#/users" data-tab="users">👥 משתמשים</a>
        <a href="#/registrations" data-tab="registrations">📝 הרשמות <span id="regBadge" class="badge" hidden></span></a>
        <a href="#/links" data-tab="links">🔗 קישורים</a>
        <a href="#/settings" data-tab="settings">⚙️ הגדרות</a>
      </nav>
      <div class="me">
        <span id="meBox" class="me-box"></span>
        <button id="logoutBtn" class="btn small ghost" type="button">התנתק</button>
      </div>
    </header>
    <div id="demoBanner" class="banner" hidden>מצב הדגמה – נתונים לדוגמה בלבד, שום דבר לא נשמר. להסרה: פתח את הכתובת בלי ‎?demo=1</div>
    <main id="main"></main>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
